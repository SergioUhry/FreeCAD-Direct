<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Par oposto e matriz sobre matriz</title><desc>Primeiro forme o par esquerda/direita; depois repita o conjunto inteiro.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#176b91"/></marker></defs><rect width="1100" height="520" fill="#f5f8fc"/><text x="36" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#12324b" font-weight="700" text-anchor="start">Par oposto e matriz sobre matriz</text><text x="36" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#4d6374" font-weight="400" text-anchor="start">Primeiro forme o par esquerda/direita; depois repita o conjunto inteiro.</text><text x="36" y="126" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#12324b" font-weight="700" text-anchor="start">1. Matriz Leve: criar o par oposto</text><rect x="100" y="155" width="240" height="95" rx="7" fill="#fff" stroke="#c9d7e4" stroke-width="2"/><polygon points="120,175 135,175 135,215 170,215 170,230 120,230" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><polygon points="320,175 305,175 305,215 270,215 270,230 320,230" fill="#dff3ec" stroke="#27876a" stroke-width="2"/><line x1="178" y1="202" x2="262" y2="202" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#12324b" font-weight="400" text-anchor="start">2 ocorrências: original + peça espelhada</text><text x="420" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#12324b" font-weight="400" text-anchor="start">Escolher eixo e intervalo, vão ou total.</text><text x="36" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#12324b" font-weight="700" text-anchor="start">2. Selecionar o par e criar outra Matriz Leve</text><rect x="100" y="335" width="240" height="95" rx="7" fill="#fff" stroke="#c9d7e4" stroke-width="2"/><polygon points="120,355 135,355 135,395 170,395 170,410 120,410" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><polygon points="320,355 305,355 305,395 270,395 270,410 320,410" fill="#dff3ec" stroke="#27876a" stroke-width="2"/><line x1="178" y1="382" x2="262" y2="382" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="335" width="240" height="95" rx="7" fill="#fff" stroke="#c9d7e4" stroke-width="2"/><polygon points="430,355 445,355 445,395 480,395 480,410 430,410" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><polygon points="630,355 615,355 615,395 580,395 580,410 630,410" fill="#dff3ec" stroke="#27876a" stroke-width="2"/><line x1="488" y1="382" x2="572" y2="382" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="335" width="240" height="95" rx="7" fill="#fff" stroke="#c9d7e4" stroke-width="2"/><polygon points="740,355 755,355 755,395 790,395 790,410 740,410" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><polygon points="940,355 925,355 925,395 890,395 890,410 940,410" fill="#dff3ec" stroke="#27876a" stroke-width="2"/><line x1="798" y1="382" x2="882" y2="382" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><text x="100" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#12324b" font-weight="700" text-anchor="start">3 conjuntos × 2 peças = 6 peças</text><text x="36" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#4d6374" font-weight="400" text-anchor="start">Abrir Matriz Leve com uma matriz selecionada cria outra matriz; não abre a edição da primeira.</text></svg>