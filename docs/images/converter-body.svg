<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Converter para Body: dimensões preservadas</title><desc>Exemplo com um cubo paramétrico; o objeto original continua sendo a fonte.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#176b91"/></marker></defs><rect width="1100" height="520" fill="#f5f8fc"/><text x="36" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#12324b" font-weight="700" text-anchor="start">Converter para Body: dimensões preservadas</text><text x="36" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#4d6374" font-weight="400" text-anchor="start">Exemplo com um cubo paramétrico; o objeto original continua sendo a fonte.</text><rect x="36" y="118" width="290" height="245" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="56" y="153" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start">ANTES</text><rect x="72" y="177" width="210" height="95" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="96" y="233" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#12324b" font-weight="700" text-anchor="start">Cubo</text><text x="56" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#12324b" font-weight="400" text-anchor="start">Length / Width / Height</text><text x="56" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="400" text-anchor="start">Medidas do objeto original</text><line x1="343" y1="240" x2="424" y2="240" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><rect x="444" y="118" width="620" height="245" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="464" y="153" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start">DEPOIS</text><text x="464" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#12324b" font-weight="700" text-anchor="start">Body  →  Base_Direct</text><text x="464" y="230" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#12324b" font-weight="400" text-anchor="start">Dados → Dimensões da fonte</text><text x="464" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">Length = 600    Width = 400    Height = 18</text><text x="464" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#12324b" font-weight="400" text-anchor="start">Source → Cubo original preservado</text><text x="464" y="338" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="400" text-anchor="start">A base recebe a forma da fonte.</text><rect x="36" y="390" width="1028" height="62" rx="7" fill="#fff2d8" stroke="#c99831" stroke-width="2"/><text x="56" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="700" text-anchor="start">Editar medida: selecione Base_Direct. Mover a peça: selecione o Body.</text><text x="56" y="442" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="400" text-anchor="start">Se a medida usa expressão, altere o parâmetro que a controla na fonte.</text><text x="36" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#4d6374" font-weight="400" text-anchor="start">A exibição do objeto fonte como filho na árvore pode variar.</text></svg>