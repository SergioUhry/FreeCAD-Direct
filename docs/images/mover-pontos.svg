<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Mover por Pontos: ponto-base e ponto-destino</title><desc>Exemplo em vista superior: translação de 300 mm em X e 100 mm em Y.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#176b91"/></marker></defs><rect width="1100" height="520" fill="#f5f8fc"/><text x="36" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#12324b" font-weight="700" text-anchor="start">Mover por Pontos: ponto-base e ponto-destino</text><text x="36" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#4d6374" font-weight="400" text-anchor="start">Exemplo em vista superior: translação de 300 mm em X e 100 mm em Y.</text><rect x="110" y="285" width="170" height="100" rx="7" fill="#fff" stroke="#7f9cb0" stroke-width="2" stroke-dasharray="7 5"/><circle cx="110" cy="385" r="6" fill="#176b91"/><text x="122" y="375" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start">A: ponto-base</text><rect x="620" y="115" width="170" height="100" rx="7" fill="#dff3ec" stroke="#27876a" stroke-width="2"/><circle cx="620" cy="215" r="6" fill="#176b91"/><text x="632" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start">B: ponto-destino</text><line x1="110" y1="385" x2="620" y2="215" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><line x1="110" y1="420" x2="620" y2="420" stroke="#176b91" stroke-width="2" stroke-dasharray="7 5"/><line x1="620" y1="420" x2="620" y2="215" stroke="#176b91" stroke-width="2" stroke-dasharray="7 5"/><line x1="110" y1="454" x2="620" y2="454" stroke="#176b91" stroke-width="2"/><line x1="110" y1="447" x2="110" y2="461" stroke="#176b91" stroke-width="2"/><line x1="620" y1="447" x2="620" y2="461" stroke="#176b91" stroke-width="2"/><text x="365.0" y="444" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="400" text-anchor="middle">ΔX = +300 mm</text><text x="645" y="337" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#12324b" font-weight="400" text-anchor="start">ΔY = +100 mm</text><text x="340" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">1. Selecionar a peça</text><text x="340" y="181" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">2. Iniciar Mover por Pontos</text><text x="340" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">3. Clicar A e depois B</text><text x="36" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#4d6374" font-weight="400" text-anchor="start">Mover altera a posição. O modo Copy do Draft mantém a origem e cria uma cópia.</text></svg>