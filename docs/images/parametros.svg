<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Parâmetros: uma medida controla a peça</title><desc>Exemplo esquemático: largura útil de um painel; unidades em milímetros.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#176b91"/></marker></defs><rect width="1100" height="520" fill="#f5f8fc"/><text x="36" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#12324b" font-weight="700" text-anchor="start">Parâmetros: uma medida controla a peça</text><text x="36" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#4d6374" font-weight="400" text-anchor="start">Exemplo esquemático: largura útil de um painel; unidades em milímetros.</text><rect x="36" y="120" width="300" height="100" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="56" y="151" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="700" text-anchor="start">1. CADASTRAR</text><text x="56" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#12324b" font-weight="400" text-anchor="start">Largura = 600 mm</text><rect x="36" y="250" width="300" height="100" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="56" y="281" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="700" text-anchor="start">2. CADASTRAR</text><text x="56" y="313" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#12324b" font-weight="400" text-anchor="start">Espessura = 18 mm</text><rect x="405" y="150" width="310" height="190" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="425" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="700" text-anchor="start">3. CALCULAR</text><text x="425" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#12324b" font-weight="700" text-anchor="start">Largura útil</text><text x="425" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#12324b" font-weight="400" text-anchor="start">600 − 2 × 18 = 564 mm</text><text x="425" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="400" text-anchor="start">Salvar parâmetro e recalcular</text><line x1="336" y1="170" x2="405" y2="210" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><line x1="336" y1="300" x2="405" y2="280" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><rect x="785" y="150" width="279" height="190" rx="7" fill="#dff3ec" stroke="#27876a" stroke-width="2"/><text x="805" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="700" text-anchor="start">4. VINCULAR</text><text x="805" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#12324b" font-weight="700" text-anchor="start">Painel.Length</text><text x="805" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#12324b" font-weight="400" text-anchor="start">564 mm</text><text x="805" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="400" text-anchor="start">Escolher a medida correta</text><line x1="715" y1="245" x2="785" y2="245" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#4d6374" font-weight="400" text-anchor="start">Ao mudar o parâmetro, recalcule e confira as propriedades vinculadas.</text></svg>