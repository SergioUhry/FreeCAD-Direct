<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Uma face de referência, dois resultados</title><desc>Escolha a ferramenta conforme queira continuar a peça ou iniciar outra peça.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#176b91"/></marker></defs><rect width="1100" height="520" fill="#f5f8fc"/><text x="36" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#12324b" font-weight="700" text-anchor="start">Uma face de referência, dois resultados</text><text x="36" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#4d6374" font-weight="400" text-anchor="start">Escolha a ferramenta conforme queira continuar a peça ou iniciar outra peça.</text><rect x="36" y="113" width="498" height="326" rx="7" fill="#fff" stroke="#c9d7e4" stroke-width="2"/><rect x="566" y="113" width="498" height="326" rx="7" fill="#fff" stroke="#c9d7e4" stroke-width="2"/><text x="56" y="151" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#12324b" font-weight="700" text-anchor="start">EXTRUDAR FACE</text><text x="586" y="151" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#12324b" font-weight="700" text-anchor="start">DESENHAR NA FACE</text><rect x="76" y="212" width="175" height="115" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><rect x="251" y="212" width="105" height="115" rx="7" fill="#81c8e8" stroke="#247da4" stroke-width="2"/><line x1="263" y1="265" x2="340" y2="265" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><text x="76" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#12324b" font-weight="400" text-anchor="start">Face inteira como perfil</text><text x="76" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#12324b" font-weight="700" text-anchor="start">Sketch do contorno → Pad</text><text x="76" y="400" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#12324b" font-weight="400" text-anchor="start">Continua no Body da peça.</text><rect x="606" y="212" width="175" height="115" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><rect x="812" y="238" width="150" height="65" rx="7" fill="#dff3ec" stroke="#27876a" stroke-width="2"/><line x1="793" y1="270" x2="808" y2="270" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><text x="606" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#12324b" font-weight="400" text-anchor="start">Desenhar outro perfil</text><text x="606" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#12324b" font-weight="700" text-anchor="start">Novo Body → Sketch → Pad</text><text x="606" y="400" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#12324b" font-weight="400" text-anchor="start">Cria uma peça independente.</text><text x="36" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#4d6374" font-weight="400" text-anchor="start">Contornos copiados são referências estáticas; não acompanham automaticamente a face original.</text></svg>