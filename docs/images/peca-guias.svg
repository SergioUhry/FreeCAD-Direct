<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Peça pelas Guias: quatro cruzamentos definem o perfil</title><desc>Exemplo de painel com 600 × 400 mm e extrusão de 18 mm.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#176b91"/></marker></defs><rect width="1100" height="520" fill="#f5f8fc"/><text x="36" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#12324b" font-weight="700" text-anchor="start">Peça pelas Guias: quatro cruzamentos definem o perfil</text><text x="36" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#4d6374" font-weight="400" text-anchor="start">Exemplo de painel com 600 × 400 mm e extrusão de 18 mm.</text><line x1="150" y1="110" x2="150" y2="472" stroke="#da9430" stroke-width="2" stroke-dasharray="7 5"/><line x1="570" y1="110" x2="570" y2="472" stroke="#da9430" stroke-width="2" stroke-dasharray="7 5"/><line x1="90" y1="150" x2="630" y2="150" stroke="#da9430" stroke-width="2" stroke-dasharray="7 5"/><line x1="90" y1="430" x2="630" y2="430" stroke="#da9430" stroke-width="2" stroke-dasharray="7 5"/><rect x="150" y="150" width="420" height="280" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><circle cx="150" cy="150" r="6" fill="#176b91"/><text x="162" y="140" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start"></text><circle cx="570" cy="150" r="6" fill="#176b91"/><text x="582" y="140" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start"></text><circle cx="150" cy="430" r="6" fill="#176b91"/><text x="162" y="420" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start"></text><circle cx="570" cy="430" r="6" fill="#176b91"/><text x="582" y="420" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start"></text><line x1="150" y1="465" x2="570" y2="465" stroke="#176b91" stroke-width="2"/><line x1="150" y1="458" x2="150" y2="472" stroke="#176b91" stroke-width="2"/><line x1="570" y1="458" x2="570" y2="472" stroke="#176b91" stroke-width="2"/><text x="360.0" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="400" text-anchor="middle">600 mm</text><text x="75" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="400" text-anchor="start">400 mm</text><line x1="655" y1="250" x2="710" y2="250" stroke="#176b91" stroke-width="2" marker-end="url(#arrow)"/><rect x="742" y="150" width="322" height="210" rx="7" fill="#fff" stroke="#c9d7e4" stroke-width="2"/><text x="762" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">1. Selecionar 4 guias</text><text x="762" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">2. Peça pelas Guias</text><text x="762" y="263" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">3. Pad: 18 mm</text><text x="762" y="309" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#12324b" font-weight="700" text-anchor="start">Resultado: nova peça</text><text x="36" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#4d6374" font-weight="400" text-anchor="start">Guias coplanares em dois pares paralelos. O Sketch copia as posições atuais dos cruzamentos.</text></svg>