<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Matriz Leve: intervalo, vão e total</title><desc>Quatro peças com dimensão S = 100 mm; quantidade inclui a primeira posição.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#176b91"/></marker></defs><rect width="1100" height="520" fill="#f5f8fc"/><text x="36" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#12324b" font-weight="700" text-anchor="start">Matriz Leve: intervalo, vão e total</text><text x="36" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#4d6374" font-weight="400" text-anchor="start">Quatro peças com dimensão S = 100 mm; quantidade inclui a primeira posição.</text><rect x="120" y="180" width="180" height="105" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="210" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#12324b" font-weight="700" text-anchor="middle">1</text><rect x="336" y="180" width="180" height="105" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="426" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#12324b" font-weight="700" text-anchor="middle">2</text><rect x="552" y="180" width="180" height="105" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="642" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#12324b" font-weight="700" text-anchor="middle">3</text><rect x="768" y="180" width="180" height="105" rx="7" fill="#e0eff9" stroke="#247da4" stroke-width="2"/><text x="858" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#12324b" font-weight="700" text-anchor="middle">4</text><line x1="120" y1="155" x2="300" y2="155" stroke="#176b91" stroke-width="2"/><line x1="120" y1="148" x2="120" y2="162" stroke="#176b91" stroke-width="2"/><line x1="300" y1="148" x2="300" y2="162" stroke="#176b91" stroke-width="2"/><text x="210.0" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="400" text-anchor="middle">S = 100 mm</text><line x1="300" y1="320" x2="336" y2="320" stroke="#176b91" stroke-width="2"/><line x1="300" y1="313" x2="300" y2="327" stroke="#176b91" stroke-width="2"/><line x1="336" y1="313" x2="336" y2="327" stroke="#176b91" stroke-width="2"/><text x="318.0" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="400" text-anchor="middle">V = 20 mm</text><line x1="120" y1="375" x2="336" y2="375" stroke="#176b91" stroke-width="2"/><line x1="120" y1="368" x2="120" y2="382" stroke="#176b91" stroke-width="2"/><line x1="336" y1="368" x2="336" y2="382" stroke="#176b91" stroke-width="2"/><text x="228.0" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="400" text-anchor="middle">P = 120 mm</text><line x1="120" y1="425" x2="948" y2="425" stroke="#176b91" stroke-width="2"/><line x1="120" y1="418" x2="120" y2="432" stroke="#176b91" stroke-width="2"/><line x1="948" y1="418" x2="948" y2="432" stroke="#176b91" stroke-width="2"/><text x="534.0" y="415" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="400" text-anchor="middle">T = 460 mm</text><text x="120" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">Por intervalo: 120 mm</text><text x="430" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">Por vão: 20 mm</text><text x="730" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">Por total: 460 mm</text><text x="36" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#4d6374" font-weight="400" text-anchor="start">T = S + P × (N − 1) = 100 + 120 × 3 = 460 