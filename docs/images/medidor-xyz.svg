<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Medidor XYZ Pro: medir e criar cotas de conferência</title><desc>Exemplo em XY: pontos com diferenças de 300 mm em X e 400 mm em Y.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#176b91"/></marker></defs><rect width="1100" height="520" fill="#f5f8fc"/><text x="36" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#12324b" font-weight="700" text-anchor="start">Medidor XYZ Pro: medir e criar cotas de conferência</text><text x="36" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#4d6374" font-weight="400" text-anchor="start">Exemplo em XY: pontos com diferenças de 300 mm em X e 400 mm em Y.</text><circle cx="140" cy="425" r="6" fill="#176b91"/><text x="152" y="415" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start">A</text><circle cx="350" cy="145" r="6" fill="#176b91"/><text x="362" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#12324b" font-weight="700" text-anchor="start">B</text><line x1="140" y1="425" x2="350" y2="145" stroke="#176b91" stroke-width="2"/><line x1="140" y1="425" x2="350" y2="425" stroke="#176b91" stroke-width="2" stroke-dasharray="7 5"/><line x1="350" y1="425" x2="350" y2="145" stroke="#176b91" stroke-width="2" stroke-dasharray="7 5"/><line x1="140" y1="465" x2="350" y2="465" stroke="#176b91" stroke-width="2"/><line x1="140" y1="458" x2="140" y2="472" stroke="#176b91" stroke-width="2"/><line x1="350" y1="458" x2="350" y2="472" stroke="#176b91" stroke-width="2"/><text x="245.0" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#12324b" font-weight="400" text-anchor="middle">X = 300 mm</text><text x="370" y="285" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#12324b" font-weight="400" text-anchor="start">Y = 400 mm</text><text x="125" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#12324b" font-weight="700" text-anchor="start">3D = 500 mm</text><rect x="650" y="130" width="414" height="280" rx="7" fill="#fff" stroke="#c9d7e4" stroke-width="2"/><text x="674" y="170" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">1. Ctrl: selecionar 2 elementos</text><text x="674" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">2. Medir seleção</text><text x="674" y="254" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">3. Marcar 3D, X, Y e/ou Z</text><text x="674" y="296" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="400" text-anchor="start">4. Criar cotas</text><text x="674" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#12324b" font-weight="700" text-anchor="start">Z = 0 mm neste exemplo</text><text x="36" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#4d6374" font-weight="400" text-anchor="start">Componentes são módulos. Aresta circular selecionada usa seu centro como referência.</text></svg>